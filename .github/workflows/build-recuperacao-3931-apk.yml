name: Build SeedControl Recuperacao 3931 APK

on:
  workflow_dispatch:
  push:
    branches: ["v3.8.4-dev"]
    paths:
      - ".github/workflows/build-recuperacao-3931-apk.yml"
      - "assets/seedcontrol-icon-94-original-192.png.b64"
      - "correcoes-3922/**"

permissions:
  contents: read

jobs:
  build-3931:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Validar icone 94 PNG e correcoes
        shell: bash
        run: |
          set -e
          test -s assets/seedcontrol-icon-94-original-192.png.b64
          tr -d '\r\n\t ' < assets/seedcontrol-icon-94-original-192.png.b64 | base64 --decode > /tmp/seedcontrol-icon-94.png
          test -s /tmp/seedcontrol-icon-94.png
          python - <<'PY'
          from pathlib import Path
          import struct
          p=Path('/tmp/seedcontrol-icon-94.png')
          d=p.read_bytes()
          assert d[:8] == b'\x89PNG\r\n\x1a\n', d[:16]
          assert d[12:16] == b'IHDR', d[12:16]
          w,h=struct.unpack('>II', d[16:24])
          assert (w,h)==(192,192), (w,h)
          print('icone-94-ok', w, h, len(d))
          PY
          python -m py_compile correcoes-3918/patch.py
          python -m py_compile correcoes-3919/patch.py
          python -m py_compile correcoes-3920/patch.py
          python -m py_compile correcoes-3922/patch.py
          node --check correcoes-3918/dashboard-comerciais-v3918.js
          node --check correcoes-3919/fazendas-contagem-v3919.js
          node --check correcoes-3922/entrada-comercial-lote-v3922.js

      - name: Extrair SeedControl
        shell: bash
        run: |
          set -e
          ZIP="$(find . -maxdepth 1 -type f -name 'SeedControl*.zip' -print -quit)"
          test -n "$ZIP"
          rm -rf buildsrc native
          mkdir -p buildsrc native/www
          unzip -q "$ZIP" -d buildsrc
          APP_SRC="$(dirname "$(find buildsrc -type f -name index.html -print -quit)")"
          test -f "$APP_SRC/index.html"
          cp -a "$APP_SRC"/. native/www/

      - name: Aplicar base consolidada ate 3922
        shell: bash
        run: |
          set -e
          python scripts/patch-movimentacao.py
          python scripts/patch-backup-apk.py
          python scripts/patch-duplicidade-lotes.py
          python scripts/patch-dashboard-v384.py
          python scripts/patch-exportacao-relatorios.py
          python scripts/patch-ajustes-v384.py
          python scripts/patch-planilha-exportacao-v384.py
          python scripts/patch-estoque-v384.py
          python scripts/patch-estoque-refino-v384.py
          python scripts/patch-cadastro-v384.py
          python scripts/patch-visual-geral-v384.py
          python scripts/patch-assistente-conversa-v384.py
          python scripts/patch-assistente-intencao-v384.py
          python scripts/patch-assistente-entendimento-amplo-v384.py
          python scripts/patch-assistente-cache-v384.py
          python scripts/patch-assistente-rota-v384.py
          python scripts/patch-mobile-ux-v384.py
          python scripts/patch-teclado-sugestoes-v384.py
          python scripts/patch-assistente-rodape-v384.py
          python scripts/patch-teclado-rodape-final-v384.py
          python scripts/patch-teclado-nativo-v384.py
          python scripts/patch-ime-nativo-real-v384.py --web
          python scripts/patch-estoque-busca-v384.py
          python scripts/patch-dados-soja2026-v384.py
          python scripts/patch-planilha-fiel-soja2026-v384.py
          python scripts/patch-planilha-cache-soja2026-v384.py
          python scripts/patch-relatorio-saidas-runtime-v384.py
          python scripts/patch-scroll-arrastavel-estoque-v384.py
          python scripts/patch-historico-limpeza-v384.py
          python scripts/patch-entrada-comercial-limpa-v3904.py
          python scripts/patch-nota-visualizador-v384.py
          python entrada-comercial-foto-3907/patch.py
          python estoque-ordem-3908/patch.py
          python correcoes-3909/patch.py
          python scripts/patch-lote-alfanumerico-v384.py
          python correcoes-3911/patch.py
          python correcoes-3912/patch.py
          python correcoes-3913/patch.py
          python correcoes-3914/patch.py
          python correcoes-3915/patch.py
          python correcoes-3916/patch.py
          python correcoes-3917/patch.py
          python correcoes-3918/patch.py
          python correcoes-3919/patch.py
          python correcoes-3920/patch.py
          python correcoes-3922/patch.py

      - name: Validar web consolidado
        shell: bash
        run: |
          set -e
          test -f native/www/safe-area-v3920.css
          test -f native/www/entrada-comercial-lote-v3922.js
          grep -q 'safe-area-v3920.css?v=3920' native/www/index.html
          grep -q 'fazendas-contagem-v3919.js?v=3919' native/www/index.html
          grep -q 'dashboard-comerciais-v3918.js?v=3918' native/www/index.html
          grep -q 'entrada-comercial-lote-v3922.js?v=3922' native/www/entrada-comercial.html
          grep -q 'const limite = 2000' native/www/cadastro-v384.js
          node --check native/www/entrada-comercial-lote-v3922.js
          node --check native/www/dashboard-comerciais-v3918.js
          node --check native/www/fazendas-contagem-v3919.js
          node --check native/www/detalhes-dashboard-v3915.js
          node --check native/www/cadastro.js
          node --check native/www/editar.js
          node --check native/www/estoque.js

      - name: Preparar Capacitor 8
        working-directory: native
        shell: bash
        run: |
          set -e
          cat > package.json <<'EOF'
          {
            "name": "seedcontrol",
            "version": "3.8.4",
            "private": true,
            "dependencies": {
              "@capacitor/android": "8.4.2",
              "@capacitor/core": "8.4.2",
              "@capacitor/app": "8.0.0",
              "@capacitor/filesystem": "8.1.0",
              "@capacitor/share": "8.0.0",
              "@capacitor/keyboard": "8.0.5",
              "@capacitor/clipboard": "8.0.1",
              "@capgo/capacitor-speech-recognition": "8.1.10",
              "jspdf": "2.5.1",
              "jspdf-autotable": "3.8.2",
              "xlsx": "0.18.5",
              "xlsx-js-style": "1.2.0"
            },
            "devDependencies": {
              "@capacitor/cli": "8.4.2"
            }
          }
          EOF

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "br.com.seedcontrol.app",
            "appName": "SeedControl",
            "webDir": "www",
            "backgroundColor": "#071713",
            "android": {
              "allowMixedContent": false,
              "captureInput": true,
              "webContentsDebuggingEnabled": false,
              "adjustMarginsForEdgeToEdge": "force"
            },
            "plugins": {
              "Keyboard": { "resizeOnFullScreen": true }
            }
          }
          EOF

          npm install --no-audit --no-fund
          mkdir -p www/vendor
          cp node_modules/jspdf/dist/jspdf.umd.min.js www/vendor/jspdf.umd.min.js
          cp node_modules/xlsx/dist/xlsx.full.min.js www/vendor/xlsx.full.min.js
          cp node_modules/xlsx-js-style/dist/xlsx.bundle.js www/vendor/xlsx-js-style.bundle.js
          cp node_modules/jspdf-autotable/dist/jspdf.plugin.autotable.min.js www/vendor/jspdf.plugin.autotable.min.js
          npx cap add android
          npx cap sync android

      - name: Criar plugin Android IME nativo
        shell: bash
        run: |
          set -e
          python scripts/patch-ime-nativo-real-v384.py --android

      - name: Aplicar icone 94 PNG e versao 3931
        working-directory: native
        shell: python
        run: |
          from pathlib import Path
          import shutil, re, base64, struct

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          for permissao in (
              '<uses-permission android:name="android.permission.CAMERA" />',
              '<uses-permission android:name="android.permission.RECORD_AUDIO" />'
          ):
              if permissao not in text:
                  text = text.replace('<application', permissao + '\n\n    <application', 1)

          if 'android:windowSoftInputMode=' in text:
              text = re.sub(r'android:windowSoftInputMode="[^"]*"', 'android:windowSoftInputMode="adjustResize"', text, count=1)
          elif 'android:name=".MainActivity"' in text:
              text = text.replace('android:name=".MainActivity"', 'android:name=".MainActivity"\n            android:windowSoftInputMode="adjustResize"', 1)

          bruto = Path('../assets/seedcontrol-icon-94-original-192.png.b64').read_text(encoding='utf-8')
          limpo = ''.join(bruto.split())
          icon_bytes = base64.b64decode(limpo)
          if icon_bytes[:8] != b'\x89PNG\r\n\x1a\n':
              raise SystemExit('Icone 94 nao e PNG valido')
          w,h = struct.unpack('>II', icon_bytes[16:24])
          if (w,h) != (192,192):
              raise SystemExit(f'Icone 94 dimensao inesperada: {w}x{h}')

          icon_source = Path('seedcontrol-icon-94.png')
          icon_source.write_bytes(icon_bytes)
          res = Path('android/app/src/main/res')
          for pasta in res.glob('mipmap*'):
              if pasta.is_dir():
                  for arquivo in pasta.glob('ic_launcher*'):
                      if arquivo.is_file():
                          arquivo.unlink()
          mipmap = res / 'mipmap-nodpi'
          mipmap.mkdir(parents=True, exist_ok=True)
          shutil.copy2(icon_source, mipmap / 'ic_launcher.png')
          shutil.copy2(icon_source, mipmap / 'ic_launcher_round.png')
          text = re.sub(r'android:icon="[^"]+"', 'android:icon="@mipmap/ic_launcher"', text, count=1)
          text = re.sub(r'android:roundIcon="[^"]+"', 'android:roundIcon="@mipmap/ic_launcher_round"', text, count=1)
          manifest.write_text(text, encoding='utf-8')

          gradle = Path('android/app/build.gradle')
          g = gradle.read_text(encoding='utf-8')
          g = g.replace('versionCode 1', 'versionCode 3931')
          g = g.replace('versionName "1.0"', 'versionName "3.8.4"')
          gradle.write_text(g, encoding='utf-8')

      - name: Restaurar chave de assinatura
        working-directory: native/android
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.SEEDCONTROL_KEYSTORE_BASE64 }}
        run: |
          set -e
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > seedcontrol-release.jks
          test -s seedcontrol-release.jks

      - name: Compilar APK release
        working-directory: native/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Validar APK final 3931
        working-directory: native/android
        shell: bash
        run: |
          set -e
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$APK"
          AAPT2="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -n 1)"
          "$AAPT2" dump badging "$APK" | grep -q "package: name='br.com.seedcontrol.app'"
          "$AAPT2" dump badging "$APK" | grep -q "versionCode='3931'"
          test -f app/src/main/res/mipmap-nodpi/ic_launcher.png
          unzip -p "$APK" assets/public/index.html | grep -q 'safe-area-v3920.css?v=3920'
          unzip -p "$APK" assets/public/entrada-comercial.html | grep -q 'entrada-comercial-lote-v3922.js?v=3922'
          unzip -p "$APK" assets/public/entrada-comercial-lote-v3922.js | grep -q 'repararLista3922'
          unzip -p "$APK" assets/public/dashboard-comerciais-v3918.js | grep -q 'Sementes Comerciais'

      - name: Assinar APK
        working-directory: native/android
        shell: bash
        env:
          KS_PASS: ${{ secrets.SEEDCONTROL_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SEEDCONTROL_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.SEEDCONTROL_KEY_PASSWORD }}
        run: |
          set -e
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED="app/build/outputs/apk/release/SeedControl-v3.8.4-recuperacao-3931-signed.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" sign \
            --ks seedcontrol-release.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS \
            --key-pass env:KEY_PASS \
            --out "$SIGNED" \
            "$UNSIGNED"
          "$APKSIGNER" verify --verbose --print-certs "$SIGNED"

      - name: Guardar APK assinado
        uses: actions/upload-artifact@v7
        with:
          name: SeedControl-v3.8.4-recuperacao-3931-signed-apk
          path: native/android/app/build/outputs/apk/release/SeedControl-v3.8.4-recuperacao-3931-signed.apk
          if-no-files-found: error
          retention-days: 14
