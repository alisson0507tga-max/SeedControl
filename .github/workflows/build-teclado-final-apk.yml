name: Build SeedControl Teclado Final APK

on:
  workflow_dispatch:
  push:
    branches: ["v3.8.4-dev"]
    paths:
      - ".github/workflows/build-teclado-final-apk.yml"
      - "scripts/patch-teclado-rodape-final-v384.py"

permissions:
  contents: read

jobs:
  build-teclado-final:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Extrair SeedControl
        shell: bash
        run: |
          ZIP="$(find . -maxdepth 1 -type f -name 'SeedControl*.zip' -print -quit)"
          test -n "$ZIP"
          rm -rf buildsrc native
          mkdir -p buildsrc native/www
          unzip -q "$ZIP" -d buildsrc
          APP_SRC="$(dirname "$(find buildsrc -type f -name index.html -print -quit)")"
          test -f "$APP_SRC/index.html"
          cp -a "$APP_SRC"/. native/www/

      - name: Aplicar base v3.8.4 completa
        shell: bash
        run: |
          python scripts/patch-movimentacao.py
          python scripts/patch-backup-apk.py
          python scripts/patch-duplicidade-lotes.py
          python scripts/patch-dashboard-v384.py
          python scripts/patch-exportacao-relatorios.py
          python scripts/patch-ajustes-v384.py
          python scripts/patch-planilha-exportacao-v384.py
          python scripts/patch-estoque-v384.py
          python scripts/patch-estoque-refino-v384.py
          python scripts/patch-cadastro-v384.py
          python scripts/patch-visual-geral-v384.py
          python scripts/patch-assistente-conversa-v384.py
          python scripts/patch-assistente-intencao-v384.py
          python scripts/patch-assistente-entendimento-amplo-v384.py
          python scripts/patch-assistente-cache-v384.py
          python scripts/patch-assistente-rota-v384.py
          python scripts/patch-mobile-ux-v384.py
          python scripts/patch-teclado-sugestoes-v384.py
          python scripts/patch-assistente-rodape-v384.py
          python scripts/patch-teclado-rodape-final-v384.py

      - name: Validar correção final web
        shell: bash
        run: |
          test -f native/www/assistente-chat-v384.html
          test -f native/www/cadastro.html
          test -f native/www/seed-teclado-final-v3825.css
          test -f native/www/seed-teclado-final-v3825.js
          test -f native/www/assistente-v384.js
          test -f native/www/mobile-ux-v384.js

          grep -q 'seed-teclado-final-v3825.css' native/www/assistente-chat-v384.html
          grep -q 'seed-teclado-final-v3825.js' native/www/assistente-chat-v384.html
          grep -q 'seed-teclado-final-v3825.css' native/www/cadastro.html
          grep -q 'seed-teclado-final-v3825.js' native/www/cadastro.html
          grep -q 'seedcontrol-teclado-final-v3825' native/www/seed-teclado-final-v3825.js
          grep -q 'keyboardWillShow' native/www/seed-teclado-final-v3825.js
          grep -q 'Clipboard' native/www/seed-teclado-final-v3825.js
          grep -q 'seed-sugestoes-v3825' native/www/seed-teclado-final-v3825.css
          grep -q 'padding-bottom: 62px' native/www/seed-teclado-final-v3825.css
          grep -q 'seedcontrol-assistente-entendimento-amplo-v384' native/www/assistente-v384.js
          grep -q 'backButton' native/www/mobile-ux-v384.js

          node --check native/www/seed-teclado-final-v3825.js
          node --check native/www/assistente-v384.js
          node --check native/www/mobile-ux-v384.js

          while IFS= read -r -d '' arquivo; do
            node --check "$arquivo"
          done < <(find native/www -maxdepth 1 -type f -name '*.js' -print0)

      - name: Preparar Capacitor 8 com teclado e clipboard
        working-directory: native
        shell: bash
        run: |
          cat > package.json <<'EOF'
          {
            "name": "seedcontrol",
            "version": "3.8.4",
            "private": true,
            "dependencies": {
              "@capacitor/android": "8.4.2",
              "@capacitor/core": "8.4.2",
              "@capacitor/app": "8.0.0",
              "@capacitor/filesystem": "8.1.0",
              "@capacitor/share": "8.0.0",
              "@capacitor/clipboard": "8.0.1",
              "@capacitor/keyboard": "8.0.5",
              "@capgo/capacitor-speech-recognition": "8.1.10",
              "jspdf": "2.5.1",
              "jspdf-autotable": "3.8.2",
              "xlsx": "0.18.5",
              "xlsx-js-style": "1.2.0"
            },
            "devDependencies": {
              "@capacitor/cli": "8.4.2"
            }
          }
          EOF

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "br.com.seedcontrol.app",
            "appName": "SeedControl",
            "webDir": "www",
            "backgroundColor": "#071713",
            "android": {
              "allowMixedContent": false,
              "captureInput": true,
              "webContentsDebuggingEnabled": false
            },
            "plugins": {
              "Keyboard": {
                "resizeOnFullScreen": true
              }
            }
          }
          EOF

          npm install --no-audit --no-fund
          test -d node_modules/@capacitor/app
          test -d node_modules/@capacitor/clipboard
          test -d node_modules/@capacitor/keyboard
          test -d node_modules/@capgo/capacitor-speech-recognition

          mkdir -p www/vendor
          cp node_modules/jspdf/dist/jspdf.umd.min.js www/vendor/jspdf.umd.min.js
          cp node_modules/xlsx/dist/xlsx.full.min.js www/vendor/xlsx.full.min.js
          cp node_modules/xlsx-js-style/dist/xlsx.bundle.js www/vendor/xlsx-js-style.bundle.js
          cp node_modules/jspdf-autotable/dist/jspdf.plugin.autotable.min.js www/vendor/jspdf.plugin.autotable.min.js

          npx cap add android
          npx cap sync android

      - name: Ajustar Android e versão
        working-directory: native
        shell: python
        run: |
          from pathlib import Path
          import shutil, re, base64

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')

          for permissao in (
              '<uses-permission android:name="android.permission.CAMERA" />',
              '<uses-permission android:name="android.permission.RECORD_AUDIO" />'
          ):
              if permissao not in text:
                  text = text.replace('<application', permissao + '\n\n    <application', 1)

          # Força o WebView a reduzir quando o teclado abre.
          if 'android:windowSoftInputMode=' in text:
              text = re.sub(r'android:windowSoftInputMode="[^"]*"', 'android:windowSoftInputMode="adjustResize"', text, count=1)
          elif 'android:name=".MainActivity"' in text:
              text = text.replace(
                  'android:name=".MainActivity"',
                  'android:name=".MainActivity"\n            android:windowSoftInputMode="adjustResize"',
                  1
              )

          icon_bytes = base64.b64decode(
              Path('../assets/seedcontrol-icon-v384.webp.b64').read_text(encoding='utf-8').strip(),
              validate=True
          )
          if icon_bytes[:4] != b'RIFF' or icon_bytes[8:12] != b'WEBP':
              raise SystemExit('Ícone WebP inválido.')

          icon_source = Path('seedcontrol-icon-v384.webp')
          icon_source.write_bytes(icon_bytes)
          res = Path('android/app/src/main/res')

          for pasta in res.glob('mipmap*'):
              if pasta.is_dir():
                  for arquivo in pasta.glob('ic_launcher*'):
                      if arquivo.is_file():
                          arquivo.unlink()

          mipmap = res / 'mipmap-nodpi'
          mipmap.mkdir(parents=True, exist_ok=True)
          shutil.copy2(icon_source, mipmap / 'ic_launcher.webp')
          shutil.copy2(icon_source, mipmap / 'ic_launcher_round.webp')

          text = re.sub(r'android:icon="[^"]+"', 'android:icon="@mipmap/ic_launcher"', text, count=1)
          text = re.sub(r'android:roundIcon="[^"]+"', 'android:roundIcon="@mipmap/ic_launcher_round"', text, count=1)
          manifest.write_text(text, encoding='utf-8')

          gradle = Path('android/app/build.gradle')
          g = gradle.read_text(encoding='utf-8')
          g = g.replace('versionCode 1', 'versionCode 3825')
          g = g.replace('versionName "1.0"', 'versionName "3.8.4"')
          gradle.write_text(g, encoding='utf-8')
          print('SeedControl v3.8.4 teclado final preparado com versionCode 3825.')

      - name: Restaurar chave de assinatura
        working-directory: native/android
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.SEEDCONTROL_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > seedcontrol-release.jks
          test -s seedcontrol-release.jks

      - name: Compilar APK release
        working-directory: native/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Validar APK final
        working-directory: native/android
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$APK"

          unzip -l "$APK" | grep -q 'assets/public/assistente-chat-v384.html'
          unzip -l "$APK" | grep -q 'assets/public/cadastro.html'
          unzip -l "$APK" | grep -q 'assets/public/seed-teclado-final-v3825.css'
          unzip -l "$APK" | grep -q 'assets/public/seed-teclado-final-v3825.js'

          TMP="$(mktemp -d)"
          unzip -q "$APK" \
            'assets/public/assistente-chat-v384.html' \
            'assets/public/cadastro.html' \
            'assets/public/seed-teclado-final-v3825.css' \
            'assets/public/seed-teclado-final-v3825.js' \
            -d "$TMP"

          grep -q 'seed-teclado-final-v3825.js' "$TMP/assets/public/assistente-chat-v384.html"
          grep -q 'seed-teclado-final-v3825.js' "$TMP/assets/public/cadastro.html"
          grep -q 'keyboardWillShow' "$TMP/assets/public/seed-teclado-final-v3825.js"
          grep -q 'Clipboard' "$TMP/assets/public/seed-teclado-final-v3825.js"
          grep -q 'padding-bottom: 62px' "$TMP/assets/public/seed-teclado-final-v3825.css"

          grep -q 'android:windowSoftInputMode="adjustResize"' app/src/main/AndroidManifest.xml

          AAPT2="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -n 1)"
          "$AAPT2" dump badging "$APK" | grep -q "application:"
          echo "APK validado: rodapé seguro + teclado nativo + faixa própria de sugestões e colar."

      - name: Assinar APK
        working-directory: native/android
        shell: bash
        env:
          KS_PASS: ${{ secrets.SEEDCONTROL_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SEEDCONTROL_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.SEEDCONTROL_KEY_PASSWORD }}
        run: |
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED="app/build/outputs/apk/release/SeedControl-v3.8.4-teclado-final-signed.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"

          "$APKSIGNER" sign \
            --ks seedcontrol-release.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS \
            --key-pass env:KEY_PASS \
            --out "$SIGNED" \
            "$UNSIGNED"

          "$APKSIGNER" verify --verbose --print-certs "$SIGNED"

      - name: Guardar APK assinado
        uses: actions/upload-artifact@v7
        with:
          name: SeedControl-v3.8.4-teclado-final-signed-apk
          path: native/android/app/build/outputs/apk/release/SeedControl-v3.8.4-teclado-final-signed.apk
          if-no-files-found: error
          retention-days: 14
