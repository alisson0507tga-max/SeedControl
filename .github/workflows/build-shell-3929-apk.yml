name: Build SeedControl Shell 3929 APK

on:
  workflow_dispatch:
  push:
    branches: ["v3.8.4-dev"]
    paths:
      - ".github/workflows/build-shell-3929-apk.yml"

permissions:
  contents: write

jobs:
  build-shell-3929:
    runs-on: ubuntu-latest
    steps:
      - name: Compilar, assinar e publicar sem actions externas
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          KEYSTORE_BASE64: ${{ secrets.SEEDCONTROL_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.SEEDCONTROL_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SEEDCONTROL_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.SEEDCONTROL_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          echo '=== Ambiente ==='
          node --version
          npm --version
          export JAVA_HOME="${JAVA_HOME_21_X64}"
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version

          echo '=== Checkout manual ==='
          rm -rf repo
          mkdir repo
          cd repo
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git fetch -q --depth=1 origin "$SHA"
          git checkout -q --detach FETCH_HEAD

          echo '=== Validar fontes ==='
          test -f correcoes-3926/patch.py
          test -f correcoes-3922/patch.py
          test -f correcoes-3922/entrada-comercial-lote-v3922.js
          test -f assets/seedcontrol-icon-94-original-256.png.b64
          python -m py_compile correcoes-3918/patch.py correcoes-3919/patch.py correcoes-3920/patch.py correcoes-3922/patch.py correcoes-3926/patch.py
          node --check correcoes-3918/dashboard-comerciais-v3918.js
          node --check correcoes-3919/fazendas-contagem-v3919.js
          node --check correcoes-3922/entrada-comercial-lote-v3922.js
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib
          p=Path('assets/seedcontrol-icon-94-original-256.png.b64')
          d=base64.b64decode(p.read_text(encoding='utf-8').strip(), validate=True)
          assert d.startswith(b'\x89PNG\r\n\x1a\n'), d[:16]
          sha=hashlib.sha256(d).hexdigest()
          assert sha == '79b8b15e490ee9d0c1ec633a09bba8546c64b029b361611a80b8452cb29219f1', sha
          print('Icone 94 PNG fiel OK:', len(d), 'bytes', sha)
          PY

          echo '=== Extrair SeedControl ==='
          ZIP="$(find . -maxdepth 1 -type f -name 'SeedControl*.zip' -print -quit)"
          test -n "$ZIP"
          rm -rf buildsrc native
          mkdir -p buildsrc native/www
          unzip -q "$ZIP" -d buildsrc
          APP_SRC="$(dirname "$(find buildsrc -type f -name index.html -print -quit)")"
          test -f "$APP_SRC/index.html"
          cp -a "$APP_SRC"/. native/www/

          echo '=== Aplicar cadeia acumulada ==='
          python scripts/patch-movimentacao.py
          python scripts/patch-backup-apk.py
          python scripts/patch-duplicidade-lotes.py
          python scripts/patch-dashboard-v384.py
          python scripts/patch-exportacao-relatorios.py
          python scripts/patch-ajustes-v384.py
          python scripts/patch-planilha-exportacao-v384.py
          python scripts/patch-estoque-v384.py
          python scripts/patch-estoque-refino-v384.py
          python scripts/patch-cadastro-v384.py
          python scripts/patch-visual-geral-v384.py
          python scripts/patch-assistente-conversa-v384.py
          python scripts/patch-assistente-intencao-v384.py
          python scripts/patch-assistente-entendimento-amplo-v384.py
          python scripts/patch-assistente-cache-v384.py
          python scripts/patch-assistente-rota-v384.py
          python scripts/patch-mobile-ux-v384.py
          python scripts/patch-teclado-sugestoes-v384.py
          python scripts/patch-assistente-rodape-v384.py
          python scripts/patch-teclado-rodape-final-v384.py
          python scripts/patch-teclado-nativo-v384.py
          python scripts/patch-ime-nativo-real-v384.py --web
          python scripts/patch-estoque-busca-v384.py
          python scripts/patch-dados-soja2026-v384.py
          python scripts/patch-planilha-fiel-soja2026-v384.py
          python scripts/patch-planilha-cache-soja2026-v384.py
          python scripts/patch-relatorio-saidas-runtime-v384.py
          python scripts/patch-scroll-arrastavel-estoque-v384.py
          python scripts/patch-historico-limpeza-v384.py
          python scripts/patch-entrada-comercial-limpa-v3904.py
          python scripts/patch-nota-visualizador-v384.py
          python entrada-comercial-foto-3907/patch.py
          python estoque-ordem-3908/patch.py
          python correcoes-3909/patch.py
          python scripts/patch-lote-alfanumerico-v384.py
          python correcoes-3911/patch.py
          python correcoes-3912/patch.py
          python correcoes-3913/patch.py
          python correcoes-3914/patch.py
          python correcoes-3915/patch.py
          python correcoes-3916/patch.py
          python correcoes-3917/patch.py
          python correcoes-3918/patch.py
          python correcoes-3919/patch.py
          python correcoes-3920/patch.py
          python correcoes-3922/patch.py
          python correcoes-3926/patch.py

          echo '=== Validar web gerado ==='
          test -f native/www/index.html
          test -f native/www/entrada-comercial.html
          test -f native/www/entrada-comercial-lote-v3922.js
          test -f native/www/safe-area-v3920.css
          grep -q 'entrada-comercial-lote-v3922.js?v=3922' native/www/entrada-comercial.html
          grep -q 'safe-area-v3920.css?v=3920' native/www/index.html
          grep -q 'dashboard-comerciais-v3918.js?v=3918' native/www/index.html
          grep -q 'fazendas-contagem-v3919.js?v=3919' native/www/index.html
          grep -q 'const limite = 2000' native/www/cadastro-v384.js
          node --check native/www/entrada-comercial-lote-v3922.js
          node --check native/www/dashboard-comerciais-v3918.js
          node --check native/www/fazendas-contagem-v3919.js
          node --check native/www/cadastro.js
          node --check native/www/editar.js
          node --check native/www/estoque.js

          echo '=== Preparar Capacitor 8 ==='
          cd native
          cat > package.json <<'EOF'
          {
            "name": "seedcontrol",
            "version": "3.8.4",
            "private": true,
            "dependencies": {
              "@capacitor/android": "8.4.2",
              "@capacitor/core": "8.4.2",
              "@capacitor/app": "8.0.0",
              "@capacitor/filesystem": "8.1.0",
              "@capacitor/share": "8.0.0",
              "@capacitor/keyboard": "8.0.5",
              "@capacitor/clipboard": "8.0.1",
              "@capgo/capacitor-speech-recognition": "8.1.10",
              "jspdf": "2.5.1",
              "jspdf-autotable": "3.8.2",
              "xlsx": "0.18.5",
              "xlsx-js-style": "1.2.0"
            },
            "devDependencies": {
              "@capacitor/cli": "8.4.2"
            }
          }
          EOF
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "br.com.seedcontrol.app",
            "appName": "SeedControl",
            "webDir": "www",
            "backgroundColor": "#071713",
            "android": {
              "allowMixedContent": false,
              "captureInput": true,
              "webContentsDebuggingEnabled": false,
              "adjustMarginsForEdgeToEdge": "force"
            },
            "plugins": {
              "Keyboard": { "resizeOnFullScreen": true }
            }
          }
          EOF
          npm install --no-audit --no-fund
          mkdir -p www/vendor
          cp node_modules/jspdf/dist/jspdf.umd.min.js www/vendor/jspdf.umd.min.js
          cp node_modules/xlsx/dist/xlsx.full.min.js www/vendor/xlsx.full.min.js
          cp node_modules/xlsx-js-style/dist/xlsx.bundle.js www/vendor/xlsx-js-style.bundle.js
          cp node_modules/jspdf-autotable/dist/jspdf.plugin.autotable.min.js www/vendor/jspdf.plugin.autotable.min.js
          npx cap add android
          npx cap sync android
          cd ..

          echo '=== IME Android ==='
          python scripts/patch-ime-nativo-real-v384.py --android

          echo '=== Icone 94 PNG + versao 3929 ==='
          python - <<'PY'
          from pathlib import Path
          import shutil, re, base64, hashlib
          manifest=Path('native/android/app/src/main/AndroidManifest.xml')
          text=manifest.read_text(encoding='utf-8')
          for permissao in (
              '<uses-permission android:name="android.permission.CAMERA" />',
              '<uses-permission android:name="android.permission.RECORD_AUDIO" />'
          ):
              if permissao not in text:
                  text=text.replace('<application', permissao+'\n\n    <application', 1)
          if 'android:windowSoftInputMode=' in text:
              text=re.sub(r'android:windowSoftInputMode="[^"]*"','android:windowSoftInputMode="adjustResize"',text,count=1)
          elif 'android:name=".MainActivity"' in text:
              text=text.replace('android:name=".MainActivity"','android:name=".MainActivity"\n            android:windowSoftInputMode="adjustResize"',1)
          raw=base64.b64decode(Path('assets/seedcontrol-icon-94-original-256.png.b64').read_text().strip(), validate=True)
          assert hashlib.sha256(raw).hexdigest()=='79b8b15e490ee9d0c1ec633a09bba8546c64b029b361611a80b8452cb29219f1'
          res=Path('native/android/app/src/main/res')
          for pasta in res.glob('mipmap*'):
              if pasta.is_dir():
                  for arq in pasta.glob('ic_launcher*'):
                      if arq.is_file(): arq.unlink()
          mipmap=res/'mipmap-nodpi'
          mipmap.mkdir(parents=True, exist_ok=True)
          (mipmap/'ic_launcher.png').write_bytes(raw)
          (mipmap/'ic_launcher_round.png').write_bytes(raw)
          text=re.sub(r'android:icon="[^"]+"','android:icon="@mipmap/ic_launcher"',text,count=1)
          text=re.sub(r'android:roundIcon="[^"]+"','android:roundIcon="@mipmap/ic_launcher_round"',text,count=1)
          manifest.write_text(text, encoding='utf-8')
          gradle=Path('native/android/app/build.gradle')
          g=gradle.read_text(encoding='utf-8')
          g=re.sub(r'versionCode\s+\d+','versionCode 3929',g,count=1)
          g=re.sub(r'versionName\s+"[^"]+"','versionName "3.8.4"',g,count=1)
          gradle.write_text(g, encoding='utf-8')
          PY

          echo '=== Restaurar assinatura ==='
          cd native/android
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > seedcontrol-release.jks
          test -s seedcontrol-release.jks

          echo '=== Compilar release ==='
          ./gradlew assembleRelease --no-daemon

          echo '=== Assinar e validar ==='
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED="app/build/outputs/apk/release/SeedControl-v3.8.4-shell-3929-signed.apk"
          test -f "$UNSIGNED"
          AAPT2="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -n 1)"
          "$AAPT2" dump badging "$UNSIGNED" | grep -q "package: name='br.com.seedcontrol.app'"
          "$AAPT2" dump badging "$UNSIGNED" | grep -q "versionCode='3929'"
          test -f app/src/main/res/mipmap-nodpi/ic_launcher.png
          sha256sum app/src/main/res/mipmap-nodpi/ic_launcher.png | grep -q '79b8b15e490ee9d0c1ec633a09bba8546c64b029b361611a80b8452cb29219f1'
          unzip -p "$UNSIGNED" assets/public/entrada-comercial.html | grep -q 'entrada-comercial-lote-v3922.js?v=3922'
          unzip -p "$UNSIGNED" assets/public/index.html | grep -q 'safe-area-v3920.css?v=3920'
          unzip -p "$UNSIGNED" assets/public/dashboard-comerciais-v3918.js | grep -q 'Sementes Comerciais'
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" sign \
            --ks seedcontrol-release.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS \
            --key-pass env:KEY_PASS \
            --out "$SIGNED" \
            "$UNSIGNED"
          "$APKSIGNER" verify --verbose --print-certs "$SIGNED"
          APK_SHA="$(sha256sum "$SIGNED" | awk '{print $1}')"
          cd ../..

          echo '=== Publicar Release via API ==='
          TAG="v3.8.4-3929-shell"
          APK_NAME="SeedControl-v3.8.4-shell-3929-signed.apk"
          python - "$TAG" <<'PY' > /tmp/release.json
          import json,sys
          tag=sys.argv[1]
          print(json.dumps({
            "tag_name": tag,
            "target_commitish": "v3.8.4-dev",
            "name": "SeedControl v3.8.4 - Build 3929",
            "body": "Build de recuperação sem actions externas. Inclui ícone 94 fiel, correção de lote da Entrada Comercial, área segura, Sementes Comerciais e cadastro parcial.",
            "draft": False,
            "prerelease": True
          }))
          PY
          RELEASE_JSON="$(curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/releases" \
            --data-binary @/tmp/release.json)"
          RELEASE_ID="$(printf '%s' "$RELEASE_JSON" | python -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
          RELEASE_URL="$(printf '%s' "$RELEASE_JSON" | python -c 'import json,sys; print(json.load(sys.stdin)["html_url"])')"
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/vnd.android.package-archive" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary @"native/android/$SIGNED" \
            "https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=$APK_NAME" >/tmp/upload.json

          echo '=== Gravar marcador de sucesso ==='
          CONTENT="$(printf 'status=SUCCESS\ncommit=%s\nversionCode=3929\nrelease=%s\ntag=%s\napk=%s\nsha256=%s\nicon_sha256=79b8b15e490ee9d0c1ec633a09bba8546c64b029b361611a80b8452cb29219f1\n' "$SHA" "$RELEASE_URL" "$TAG" "$APK_NAME" "$APK_SHA" | base64 -w0)"
          python - "$CONTENT" <<'PY' > /tmp/marker.json
          import json,sys
          print(json.dumps({"message":"Registrar sucesso build 3929","content":sys.argv[1],"branch":"v3.8.4-dev"}))
          PY
          curl --fail-with-body -sS -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/contents/diagnostics/build-3929-success.txt" \
            --data-binary @/tmp/marker.json
