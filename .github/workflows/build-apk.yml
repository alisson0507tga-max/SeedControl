name: Build SeedControl APK

on:
  workflow_dispatch:
  push:
    branches: ["v3.8.4-dev"]
    paths:
      - "SeedControl*.zip"
      - ".github/workflows/build-apk.yml"
      - "scripts/**"
      - "assets/**"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Localizar ZIP do SeedControl
        id: source
        shell: bash
        run: |
          ZIP="$(find . -maxdepth 1 -type f -name 'SeedControl*.zip' -print -quit)"
          if [ -z "$ZIP" ]; then
            echo "Nenhum ZIP SeedControl encontrado na raiz do repositório."
            exit 1
          fi
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "Usando: $ZIP"

      - name: Extrair versão aprovada
        shell: bash
        run: |
          rm -rf buildsrc native
          mkdir -p buildsrc native/www
          unzip -q "${{ steps.source.outputs.zip }}" -d buildsrc
          APP_SRC="$(dirname "$(find buildsrc -type f -name index.html -print -quit)")"
          if [ ! -f "$APP_SRC/index.html" ]; then
            echo "index.html não encontrado no ZIP."
            exit 1
          fi
          echo "APP_SRC=$APP_SRC" >> "$GITHUB_ENV"
          cp -a "$APP_SRC"/. native/www/

      - name: Corrigir acesso à movimentação
        run: python scripts/patch-movimentacao.py

      - name: Corrigir backup nativo no Android
        run: python scripts/patch-backup-apk.py

      - name: Bloquear lotes duplicados
        run: python scripts/patch-duplicidade-lotes.py

      - name: Verificar arquivos e JavaScript
        shell: bash
        run: |
          test -f native/www/index.html
          test -f native/www/database.js
          test -f native/www/teste-sistema.js
          test -f native/www/manifest.json
          test -f native/www/movimentacao.html
          test -f native/www/movimentacao.js
          test -f native/www/backup.js
          test -f native/www/cadastro.js
          test -f native/www/editar.js
          test -f assets/seedcontrol-icon-v384.webp.b64
          grep -q 'data-action="movimentar"' native/www/estoque.js
          grep -q 'movimentacao.html?id=' native/www/cultivar.js
          grep -q 'Documentos/SeedControl' native/www/backup.js
          grep -q 'seedcontrol-duplicidade-cadastro-v383' native/www/cadastro.js
          grep -q 'Este lote já está cadastrado' native/www/cadastro.js
          grep -q 'seedcontrol-duplicidade-edicao-v383' native/www/editar.js
          while IFS= read -r -d '' arquivo; do
            node --check "$arquivo"
          done < <(find native/www -maxdepth 1 -type f -name '*.js' -print0)

      - name: Preparar Capacitor 8
        working-directory: native
        shell: bash
        run: |
          cat > package.json <<'EOF'
          {
            "name": "seedcontrol",
            "version": "3.8.4",
            "private": true,
            "dependencies": {
              "@capacitor/android": "8.4.2",
              "@capacitor/core": "8.4.2",
              "@capacitor/filesystem": "8.1.0"
            },
            "devDependencies": {
              "@capacitor/cli": "8.4.2"
            }
          }
          EOF

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "br.com.seedcontrol.app",
            "appName": "SeedControl",
            "webDir": "www",
            "backgroundColor": "#1f2937",
            "android": {
              "allowMixedContent": false,
              "captureInput": true,
              "webContentsDebuggingEnabled": false
            }
          }
          EOF

          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android

      - name: Ajustar Android e aplicar ícone SeedControl válido
        working-directory: native
        shell: python
        run: |
          from pathlib import Path
          import shutil
          import re
          import base64

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')

          permission = '<uses-permission android:name="android.permission.CAMERA" />'
          if permission not in text:
              text = text.replace('<application', permission + '\n\n    <application', 1)

          # Reconstrói o WebP real a partir do Base64 validado.
          icon_b64 = Path('../assets/seedcontrol-icon-v384.webp.b64')
          if not icon_b64.exists():
              raise SystemExit('Base64 do novo ícone v3.8.4 não encontrado.')

          try:
              icon_bytes = base64.b64decode(icon_b64.read_text(encoding='utf-8').strip(), validate=True)
          except Exception as exc:
              raise SystemExit(f'Base64 do ícone inválido: {exc}')

          if len(icon_bytes) < 1000:
              raise SystemExit('Ícone reconstruído é pequeno demais.')
          if icon_bytes[:4] != b'RIFF' or icon_bytes[8:12] != b'WEBP':
              raise SystemExit('Ícone reconstruído não é um WebP válido.')

          icon_source = Path('seedcontrol-icon-v384.webp')
          icon_source.write_bytes(icon_bytes)
          print(f'Ícone WebP válido reconstruído: {len(icon_bytes)} bytes')

          res = Path('android/app/src/main/res')

          # Remove todas as variantes padrão do Capacitor.
          for pasta in res.glob('mipmap*'):
              if pasta.is_dir():
                  for arquivo in pasta.glob('ic_launcher*'):
                      if arquivo.is_file():
                          arquivo.unlink()

          # Recurso único usado tanto como ícone comum quanto redondo.
          mipmap = res / 'mipmap-nodpi'
          mipmap.mkdir(parents=True, exist_ok=True)
          shutil.copy2(icon_source, mipmap / 'ic_launcher.webp')
          shutil.copy2(icon_source, mipmap / 'ic_launcher_round.webp')

          text, qtd_icon = re.subn(
              r'android:icon="[^"]+"',
              'android:icon="@mipmap/ic_launcher"',
              text,
              count=1
          )
          text, qtd_round = re.subn(
              r'android:roundIcon="[^"]+"',
              'android:roundIcon="@mipmap/ic_launcher_round"',
              text,
              count=1
          )

          if qtd_icon != 1 or qtd_round != 1:
              raise SystemExit('Não foi possível configurar icon/roundIcon no AndroidManifest.')

          manifest.write_text(text, encoding='utf-8')

          validado = manifest.read_text(encoding='utf-8')
          if 'android:icon="@mipmap/ic_launcher"' not in validado:
              raise SystemExit('android:icon não foi validado.')
          if 'android:roundIcon="@mipmap/ic_launcher_round"' not in validado:
              raise SystemExit('android:roundIcon não foi validado.')
          if (mipmap / 'ic_launcher.webp').read_bytes()[:4] != b'RIFF':
              raise SystemExit('ic_launcher.webp final inválido.')
          if (mipmap / 'ic_launcher_round.webp').read_bytes()[:4] != b'RIFF':
              raise SystemExit('ic_launcher_round.webp final inválido.')

          gradle = Path('android/app/build.gradle')
          g = gradle.read_text(encoding='utf-8')
          g = g.replace('versionCode 1', 'versionCode 3806')
          g = g.replace('versionName "1.0"', 'versionName "3.8.4"')
          gradle.write_text(g, encoding='utf-8')

          print('Ícone launcher SeedControl válido aplicado e validado.')

      - name: Restaurar chave de assinatura
        working-directory: native/android
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.SEEDCONTROL_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > seedcontrol-release.jks
          test -s seedcontrol-release.jks

      - name: Compilar APK release
        working-directory: native/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Validar ícone no APK final
        working-directory: native/android
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$APK"

          MERGED="$(find app/build/intermediates -type f -name AndroidManifest.xml | grep -E 'merged_manifests|packaged_manifests' | tail -n 1)"
          test -n "$MERGED"
          grep -q 'android:icon="@mipmap/ic_launcher"' "$MERGED"
          grep -q 'android:roundIcon="@mipmap/ic_launcher_round"' "$MERGED"

          AAPT2="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -n 1)"
          test -x "$AAPT2"
          "$AAPT2" dump badging "$APK" | tee /tmp/seedcontrol-badging.txt
          grep -q "application:" /tmp/seedcontrol-badging.txt
          grep -q "application-icon" /tmp/seedcontrol-badging.txt
          echo "Manifesto e launcher icon confirmados dentro do APK final."

      - name: Assinar APK com chave permanente
        working-directory: native/android
        shell: bash
        env:
          KS_PASS: ${{ secrets.SEEDCONTROL_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SEEDCONTROL_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.SEEDCONTROL_KEY_PASSWORD }}
        run: |
          test -n "$KS_PASS"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASS"

          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED="app/build/outputs/apk/release/SeedControl-v3.8.4-iconfix2-signed.apk"
          test -f "$UNSIGNED"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"

          "$APKSIGNER" sign \
            --ks seedcontrol-release.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS \
            --key-pass env:KEY_PASS \
            --out "$SIGNED" \
            "$UNSIGNED"

          "$APKSIGNER" verify --verbose --print-certs "$SIGNED"

      - name: Guardar APK assinado
        uses: actions/upload-artifact@v7
        with:
          name: SeedControl-v3.8.4-iconfix2-signed-apk
          path: native/android/app/build/outputs/apk/release/SeedControl-v3.8.4-iconfix2-signed.apk
          if-no-files-found: error
          retention-days: 14
