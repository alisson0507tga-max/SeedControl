name: Build SeedControl APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "SeedControl*.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Localizar ZIP do SeedControl
        id: source
        shell: bash
        run: |
          ZIP="$(find . -maxdepth 1 -type f -name 'SeedControl*.zip' -print -quit)"
          if [ -z "$ZIP" ]; then
            echo "Nenhum ZIP SeedControl encontrado na raiz do repositório."
            exit 1
          fi
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "Usando: $ZIP"

      - name: Extrair versão aprovada
        shell: bash
        run: |
          rm -rf buildsrc native
          mkdir -p buildsrc native/www
          unzip -q "${{ steps.source.outputs.zip }}" -d buildsrc
          APP_SRC="$(dirname "$(find buildsrc -type f -name index.html -print -quit)")"
          if [ ! -f "$APP_SRC/index.html" ]; then
            echo "index.html não encontrado no ZIP."
            exit 1
          fi
          echo "APP_SRC=$APP_SRC" >> "$GITHUB_ENV"
          cp -a "$APP_SRC"/. native/www/

      - name: Corrigir acesso à movimentação
        shell: python
        run: |
          from pathlib import Path

          estoque = Path("native/www/estoque.js")
          texto = estoque.read_text(encoding="utf-8")

          ancora_botao = '''<div class="acoes-registro">


<button
    type="button"
    class="btn-editar"'''

          novo_botao = '''<button
    type="button"
    class="btn-movimentar"
    data-action="movimentar"
    data-id="${item.id}"
    style="
        width:100%;
        margin-top:16px;
        background:#16a34a;
    "
>
    📦 Movimentar Estoque
</button>


<div class="acoes-registro">


<button
    type="button"
    class="btn-editar"'''

          if 'data-action="movimentar"' not in texto:
              if ancora_botao not in texto:
                  raise SystemExit("Não foi possível inserir o botão Movimentar no estoque.js")
              texto = texto.replace(ancora_botao, novo_botao, 1)

          ancora_handler = '''        // ===============================
        // QR CODE
        // ===============================

        if (
            botao.dataset.action ===
            "qrcode"
        ) {'''

          novo_handler = '''        // ===============================
        // MOVIMENTAR
        // ===============================

        if (
            botao.dataset.action ===
            "movimentar"
        ) {

            window.location.href =
                "movimentacao.html?id=" +
                encodeURIComponent(
                    id
                );

            return;

        }


        // ===============================
        // QR CODE
        // ===============================

        if (
            botao.dataset.action ===
            "qrcode"
        ) {'''

          if 'botao.dataset.action ===\n            "movimentar"' not in texto:
              if ancora_handler not in texto:
                  raise SystemExit("Não foi possível inserir a ação Movimentar no estoque.js")
              texto = texto.replace(ancora_handler, novo_handler, 1)

          estoque.write_text(texto, encoding="utf-8")

          cultivar = Path("native/www/cultivar.js")
          texto = cultivar.read_text(encoding="utf-8")

          ancora_cultivar = '''                <button
                    type="button"
                    onclick="window.location.href='cadastro.html?id=${item.id}'"
                >
                    ✏️ Editar
                </button>'''

          novo_cultivar = '''                <button
                    type="button"
                    onclick="window.location.href='movimentacao.html?id=${item.id}'"
                    style="
                        background:#16a34a;
                        margin-bottom:10px;
                    "
                >
                    📦 Movimentar Estoque
                </button>


                <button
                    type="button"
                    onclick="window.location.href='cadastro.html?id=${item.id}'"
                >
                    ✏️ Editar
                </button>'''

          if "📦 Movimentar Estoque" not in texto:
              if ancora_cultivar not in texto:
                  raise SystemExit("Não foi possível inserir o botão Movimentar no cultivar.js")
              texto = texto.replace(ancora_cultivar, novo_cultivar, 1)

          cultivar.write_text(texto, encoding="utf-8")

      - name: Verificar arquivos e JavaScript
        shell: bash
        run: |
          test -f native/www/index.html
          test -f native/www/database.js
          test -f native/www/teste-sistema.js
          test -f native/www/manifest.json
          test -f native/www/movimentacao.html
          test -f native/www/movimentacao.js
          grep -q 'data-action="movimentar"' native/www/estoque.js
          grep -q 'movimentacao.html?id=' native/www/cultivar.js
          while IFS= read -r -d '' arquivo; do
            node --check "$arquivo"
          done < <(find native/www -maxdepth 1 -type f -name '*.js' -print0)

      - name: Preparar Capacitor 8
        working-directory: native
        shell: bash
        run: |
          cat > package.json <<'EOF'
          {
            "name": "seedcontrol",
            "version": "3.8.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "8.4.2",
              "@capacitor/core": "8.4.2"
            },
            "devDependencies": {
              "@capacitor/cli": "8.4.2"
            }
          }
          EOF

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "br.com.seedcontrol.app",
            "appName": "SeedControl",
            "webDir": "www",
            "backgroundColor": "#1f2937",
            "android": {
              "allowMixedContent": false,
              "captureInput": true,
              "webContentsDebuggingEnabled": false
            }
          }
          EOF

          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android

      - name: Ajustar Android para o SeedControl
        working-directory: native
        shell: python
        run: |
          from pathlib import Path
          import shutil

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          permission = '<uses-permission android:name="android.permission.CAMERA" />'
          if permission not in text:
              text = text.replace('<application', permission + '\n\n    <application', 1)

          icon_source = Path('www/icon-512.png')
          if icon_source.exists():
              drawable = Path('android/app/src/main/res/drawable-nodpi')
              drawable.mkdir(parents=True, exist_ok=True)
              shutil.copy2(icon_source, drawable / 'seedcontrol_icon.png')
              text = text.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@drawable/seedcontrol_icon"')
              text = text.replace('android:roundIcon="@mipmap/ic_launcher_round"', 'android:roundIcon="@drawable/seedcontrol_icon"')

          manifest.write_text(text, encoding='utf-8')

          gradle = Path('android/app/build.gradle')
          g = gradle.read_text(encoding='utf-8')
          g = g.replace('versionName "1.0"', 'versionName "3.8.0"')
          gradle.write_text(g, encoding='utf-8')

      - name: Compilar APK
        working-directory: native/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v7
        with:
          name: SeedControl-v3.8-debug-apk
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
