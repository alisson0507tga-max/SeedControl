name: Build SeedControl APK

on:
  workflow_dispatch:
  push:
    branches: ["v3.8.4-dev"]
    paths:
      - "SeedControl*.zip"
      - ".github/workflows/build-apk.yml"
      - "scripts/**"
      - "assets/**"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Extrair SeedControl
        id: source
        shell: bash
        run: |
          ZIP="$(find . -maxdepth 1 -type f -name 'SeedControl*.zip' -print -quit)"
          test -n "$ZIP"
          rm -rf buildsrc native
          mkdir -p buildsrc native/www
          unzip -q "$ZIP" -d buildsrc
          APP_SRC="$(dirname "$(find buildsrc -type f -name index.html -print -quit)")"
          test -f "$APP_SRC/index.html"
          cp -a "$APP_SRC"/. native/www/
          echo "Usando: $ZIP"

      - name: Aplicar correções aprovadas
        shell: bash
        run: |
          python scripts/patch-movimentacao.py
          python scripts/patch-backup-apk.py
          python scripts/patch-duplicidade-lotes.py
          python scripts/patch-dashboard-v384.py
          python scripts/patch-exportacao-relatorios.py
          python scripts/patch-ajustes-v384.py
          python scripts/patch-planilha-exportacao-v384.py
          python scripts/patch-estoque-v384.py
          python scripts/patch-estoque-refino-v384.py
          python scripts/patch-cadastro-v384.py
          python scripts/patch-visual-geral-v384.py

      - name: Validar arquivos web
        shell: bash
        run: |
          test -f native/www/index.html
          test -f native/www/database.js
          test -f native/www/cadastro.html
          test -f native/www/cadastro.js
          test -f native/www/cadastro-v384.css
          test -f native/www/cadastro-v384.js
          test -f native/www/estoque.html
          test -f native/www/estoque.js
          test -f native/www/estoque-v384.css
          test -f native/www/planilha.js
          test -f native/www/relatorios.js
          test -f native/www/app-v384.css
          test -f assets/seedcontrol-icon-v384.webp.b64

          grep -q 'cadastro-v384.css' native/www/cadastro.html
          grep -q 'cadastro-v384.js' native/www/cadastro.html
          grep -q 'seedcontrol-cadastro-ui-v384' native/www/cadastro-v384.css
          grep -q 'seedcontrol-cadastro-nota-v384' native/www/cadastro-v384.js
          grep -q 'notaEntradaFoto' native/www/cadastro-v384.js
          grep -q 'Tirar foto' native/www/cadastro-v384.js
          grep -q 'Galeria' native/www/cadastro-v384.js
          grep -q 'seedcontrol-duplicidade-cadastro-v383' native/www/cadastro.js
          grep -q 'seedcontrol-estoque-refino-v384' native/www/estoque-v384.css
          grep -q 'seedcontrol-planilha-exportacao-nativa-v384' native/www/planilha.js
          grep -q 'seedcontrol-visual-geral-v384' native/www/app-v384.css

          QTD_TEMA="$(grep -l 'seed-v384-page' native/www/*.html | wc -l | tr -d ' ')"
          test "$QTD_TEMA" -ge 3
          echo "Tema geral aplicado em $QTD_TEMA telas."

          while IFS= read -r -d '' arquivo; do
            node --check "$arquivo"
          done < <(find native/www -maxdepth 1 -type f -name '*.js' -print0)

      - name: Preparar Capacitor 8
        working-directory: native
        shell: bash
        run: |
          cat > package.json <<'EOF'
          {
            "name": "seedcontrol",
            "version": "3.8.4",
            "private": true,
            "dependencies": {
              "@capacitor/android": "8.4.2",
              "@capacitor/core": "8.4.2",
              "@capacitor/filesystem": "8.1.0",
              "@capacitor/share": "8.0.0",
              "jspdf": "2.5.1",
              "jspdf-autotable": "3.8.2",
              "xlsx": "0.18.5",
              "xlsx-js-style": "1.2.0"
            },
            "devDependencies": {
              "@capacitor/cli": "8.4.2"
            }
          }
          EOF

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "br.com.seedcontrol.app",
            "appName": "SeedControl",
            "webDir": "www",
            "backgroundColor": "#071713",
            "android": {
              "allowMixedContent": false,
              "captureInput": true,
              "webContentsDebuggingEnabled": false
            }
          }
          EOF

          npm install --no-audit --no-fund

          mkdir -p www/vendor
          cp node_modules/jspdf/dist/jspdf.umd.min.js www/vendor/jspdf.umd.min.js
          cp node_modules/xlsx/dist/xlsx.full.min.js www/vendor/xlsx.full.min.js
          cp node_modules/xlsx-js-style/dist/xlsx.bundle.js www/vendor/xlsx-js-style.bundle.js
          cp node_modules/jspdf-autotable/dist/jspdf.plugin.autotable.min.js www/vendor/jspdf.plugin.autotable.min.js

          npx cap add android
          npx cap sync android

      - name: Ajustar Android e versão
        working-directory: native
        shell: python
        run: |
          from pathlib import Path
          import shutil, re, base64

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')

          camera = '<uses-permission android:name="android.permission.CAMERA" />'
          if camera not in text:
              text = text.replace('<application', camera + '\n\n    <application', 1)

          icon_bytes = base64.b64decode(
              Path('../assets/seedcontrol-icon-v384.webp.b64').read_text(encoding='utf-8').strip(),
              validate=True
          )
          if icon_bytes[:4] != b'RIFF' or icon_bytes[8:12] != b'WEBP':
              raise SystemExit('Ícone WebP inválido.')

          icon_source = Path('seedcontrol-icon-v384.webp')
          icon_source.write_bytes(icon_bytes)
          res = Path('android/app/src/main/res')

          for pasta in res.glob('mipmap*'):
              if pasta.is_dir():
                  for arquivo in pasta.glob('ic_launcher*'):
                      if arquivo.is_file():
                          arquivo.unlink()

          mipmap = res / 'mipmap-nodpi'
          mipmap.mkdir(parents=True, exist_ok=True)
          shutil.copy2(icon_source, mipmap / 'ic_launcher.webp')
          shutil.copy2(icon_source, mipmap / 'ic_launcher_round.webp')

          text = re.sub(r'android:icon="[^"]+"', 'android:icon="@mipmap/ic_launcher"', text, count=1)
          text = re.sub(r'android:roundIcon="[^"]+"', 'android:roundIcon="@mipmap/ic_launcher_round"', text, count=1)
          manifest.write_text(text, encoding='utf-8')

          gradle = Path('android/app/build.gradle')
          g = gradle.read_text(encoding='utf-8')
          g = g.replace('versionCode 1', 'versionCode 3815')
          g = g.replace('versionName "1.0"', 'versionName "3.8.4"')
          gradle.write_text(g, encoding='utf-8')

          print('SeedControl v3.8.4 visual geral preparado com versionCode 3815.')

      - name: Restaurar chave de assinatura
        working-directory: native/android
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.SEEDCONTROL_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > seedcontrol-release.jks
          test -s seedcontrol-release.jks

      - name: Compilar APK release
        working-directory: native/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Validar APK final
        working-directory: native/android
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$APK"

          unzip -l "$APK" | grep -q 'assets/public/cadastro-v384.css'
          unzip -l "$APK" | grep -q 'assets/public/cadastro-v384.js'
          unzip -l "$APK" | grep -q 'assets/public/estoque-v384.css'
          unzip -l "$APK" | grep -q 'assets/public/app-v384.css'
          unzip -l "$APK" | grep -q 'assets/public/vendor/jspdf.umd.min.js'
          unzip -l "$APK" | grep -q 'assets/public/vendor/xlsx-js-style.bundle.js'

          TMP="$(mktemp -d)"
          unzip -q "$APK" \
            'assets/public/cadastro.html' \
            'assets/public/cadastro-v384.js' \
            'assets/public/app-v384.css' \
            -d "$TMP"
          grep -q 'cadastro-v384.js' "$TMP/assets/public/cadastro.html"
          grep -q 'notaEntradaFoto' "$TMP/assets/public/cadastro-v384.js"
          grep -q 'seedcontrol-visual-geral-v384' "$TMP/assets/public/app-v384.css"

          AAPT2="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -n 1)"
          "$AAPT2" dump badging "$APK" | grep -q "application:"
          echo "APK validado com visual geral v3.8.4."

      - name: Assinar APK
        working-directory: native/android
        shell: bash
        env:
          KS_PASS: ${{ secrets.SEEDCONTROL_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SEEDCONTROL_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.SEEDCONTROL_KEY_PASSWORD }}
        run: |
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED="app/build/outputs/apk/release/SeedControl-v3.8.4-visual-geral-signed.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"

          "$APKSIGNER" sign \
            --ks seedcontrol-release.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS \
            --key-pass env:KEY_PASS \
            --out "$SIGNED" \
            "$UNSIGNED"

          "$APKSIGNER" verify --verbose --print-certs "$SIGNED"

      - name: Guardar APK assinado
        uses: actions/upload-artifact@v7
        with:
          name: SeedControl-v3.8.4-visual-geral-signed-apk
          path: native/android/app/build/outputs/apk/release/SeedControl-v3.8.4-visual-geral-signed.apk
          if-no-files-found: error
          retention-days: 14
