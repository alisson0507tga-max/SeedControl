name: Build SeedControl APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "SeedControl*.zip"
      - ".github/workflows/build-apk.yml"
      - "scripts/**"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Localizar ZIP do SeedControl
        id: source
        shell: bash
        run: |
          ZIP=""
          if [ -f "./SeedControl_v3.8.4_uso_imediato_source.zip" ]; then
            ZIP="./SeedControl_v3.8.4_uso_imediato_source.zip"
          else
            ZIP="$(find . -maxdepth 1 -type f -name 'SeedControl_v*.zip' -print -quit)"
          fi
          if [ -z "$ZIP" ]; then
            echo "Nenhum ZIP SeedControl encontrado na raiz do repositório."
            exit 1
          fi
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "Usando: $ZIP"

      - name: Extrair versão aprovada
        shell: bash
        run: |
          rm -rf buildsrc native
          mkdir -p buildsrc native/www
          unzip -q "${{ steps.source.outputs.zip }}" -d buildsrc
          APP_SRC="$(dirname "$(find buildsrc -type f -name index.html -print -quit)")"
          if [ ! -f "$APP_SRC/index.html" ]; then
            echo "index.html não encontrado no ZIP."
            exit 1
          fi
          echo "APP_SRC=$APP_SRC" >> "$GITHUB_ENV"
          cp -a "$APP_SRC"/. native/www/

      - name: Verificar arquivos e JavaScript
        shell: bash
        run: |
          test -f native/www/index.html
          test -f native/www/database.js
          test -f native/www/teste-sistema.js
          test -f native/www/manifest.json
          test -f native/www/movimentacao.html
          test -f native/www/movimentacao.js
          test -f native/www/backup.js
          test -f native/www/cadastro.js
          test -f native/www/editar.js
          test -f native/www/entrada-comercial.html
          test -f native/www/relatorio-saidas.html
          test -f native/www/ime-nativo-real-v3827.js
          test -f native/www/vendor/jspdf.umd.min.js
          test -f native/www/vendor/xlsx.full.min.js
          while IFS= read -r -d '' arquivo; do
            node --check "$arquivo"
          done < <(find native/www -maxdepth 1 -type f -name '*.js' -print0)

      - name: Preparar Capacitor 8
        working-directory: native
        shell: bash
        run: |
          cat > package.json <<'EOF'
          {
            "name": "seedcontrol",
            "version": "3.8.3",
            "private": true,
            "dependencies": {
              "@capacitor/android": "8.4.2",
              "@capacitor/core": "8.4.2",
              "@capacitor/filesystem": "8.1.0",
              "@capacitor/share": "8.0.2"
            },
            "devDependencies": {
              "@capacitor/cli": "8.4.2"
            }
          }
          EOF

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "br.com.seedcontrol.app",
            "appName": "SeedControl",
            "webDir": "www",
            "backgroundColor": "#1f2937",
            "android": {
              "allowMixedContent": false,
              "captureInput": true,
              "webContentsDebuggingEnabled": false
            }
          }
          EOF

          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android

      - name: Ajustar Android para o SeedControl
        working-directory: native
        shell: python
        run: |
          from pathlib import Path
          import shutil

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          permission = '<uses-permission android:name="android.permission.CAMERA" />'
          if permission not in text:
              text = text.replace('<application', permission + '\n\n    <application', 1)

          icon_source = Path('www/icon-512.png')
          if icon_source.exists():
              drawable = Path('android/app/src/main/res/drawable-nodpi')
              drawable.mkdir(parents=True, exist_ok=True)
              shutil.copy2(icon_source, drawable / 'seedcontrol_icon.png')
              text = text.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@drawable/seedcontrol_icon"')
              text = text.replace('android:roundIcon="@mipmap/ic_launcher_round"', 'android:roundIcon="@drawable/seedcontrol_icon"')

          manifest.write_text(text, encoding='utf-8')

          gradle = Path('android/app/build.gradle')
          g = gradle.read_text(encoding='utf-8')
          g = g.replace('versionCode 1', 'versionCode 3804')
          g = g.replace('versionName "1.0"', 'versionName "3.8.4"')
          gradle.write_text(g, encoding='utf-8')

      - name: Restaurar chave de assinatura
        working-directory: native/android
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.SEEDCONTROL_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > seedcontrol-release.jks
          test -s seedcontrol-release.jks

      - name: Compilar APK release
        working-directory: native/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Assinar APK com chave permanente
        working-directory: native/android
        shell: bash
        env:
          KS_PASS: ${{ secrets.SEEDCONTROL_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SEEDCONTROL_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.SEEDCONTROL_KEY_PASSWORD }}
        run: |
          test -n "$KS_PASS"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASS"

          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED="app/build/outputs/apk/release/SeedControl-v3.8.4-signed.apk"
          test -f "$UNSIGNED"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"

          "$APKSIGNER" sign \
            --ks seedcontrol-release.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS \
            --key-pass env:KEY_PASS \
            --out "$SIGNED" \
            "$UNSIGNED"

          "$APKSIGNER" verify --verbose --print-certs "$SIGNED"

      - name: Publicar APK no release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v3.8.4-teclado \
            native/android/app/build/outputs/apk/release/SeedControl-v3.8.4-signed.apk \
            --repo "${{ github.repository }}" \
            --clobber
